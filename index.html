<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CondeGátula · Librería online</title>
<meta name="description" content="Librería online: novela, ciencia, tecnología y clásicos. Envío gratis desde $40.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="ann"><div class="marq" id="marq"></div></div>
<header class="top">
  <a class="logo" href="#inicio" data-t="brand"></a>
  <nav><a href="#categorias">Categorías</a><a href="#ofertas">Ofertas</a><a href="#catalogo">Catálogo</a><a href="#opiniones">Opiniones</a><a href="#faq">Ayuda</a></nav>
  <button class="ic" id="openFav" aria-label="Favoritos">♡ <span id="favCount">0</span></button>
  <button class="cart-btn" id="openCart" aria-label="Abrir carrito">Carrito <span id="cartCount">0</span></button>
</header>

<main>
<section class="hero" id="inicio">
  <div class="hero-text">
    <p class="kicker" data-t="hero.kicker"></p>
    <h1><span data-t="hero.pre"></span> <span class="word" id="word"></span></h1>
    <div class="wchips" id="wchips"></div>
    <p class="sub" data-t="hero.sub"></p>
    <div class="cta"><a class="btn" href="#catalogo" data-t="hero.cta1"></a><a class="btn ghost" href="#ofertas" data-t="hero.cta2"></a></div>
  </div>
  <div class="catstage" id="catstage">
    <img class="cloud c1" src="portada.png" alt="" aria-hidden="true">
    <img class="cloud c2" src="portada.png" alt="" aria-hidden="true">
    <div class="catbox" id="catbox"></div>
    <div class="brush" id="brushBar"></div>
  </div>
</section>

<section class="perks" id="perks"></section>

<section class="sec" id="categorias"><h2 data-t="sections.cats"></h2><div class="cats" id="catTiles"></div></section>

<section class="sec" id="top">
  <div class="sec-head"><h2 data-t="sections.top"></h2><div class="arrows"><button data-sc="-1" aria-label="Anterior">‹</button><button data-sc="1" aria-label="Siguiente">›</button></div></div>
  <div class="rail" id="rail"></div>
</section>

<section class="month" id="mes"></section>
<section class="numbers" id="numbers"></section>

<section class="promo" id="ofertas">
  <div><h2 data-t="promo.title"></h2><p data-t="promo.text"></p><div class="count" id="count"></div></div>
  <div class="promo-books" id="promoBooks"></div>
</section>

<section class="sec catalog" id="catalogo">
  <h2 data-t="sections.catalog"></h2>
  <div class="tools">
    <input type="search" id="search" placeholder="Busca por título o autor" aria-label="Buscar libros">
    <label class="rng">Hasta <b id="maxOut"></b><input type="range" id="max" min="1" max="40" value="40" step="1"></label>
    <label class="chk"><input type="checkbox" id="onlyOffer"> Solo ofertas</label>
    <select id="sort" aria-label="Ordenar"><option value="rel">Destacados</option><option value="asc">Precio: menor a mayor</option><option value="desc">Precio: mayor a menor</option><option value="rate">Mejor valorados</option></select>
  </div>
  <div class="chips" id="chips"></div>
  <p class="found" id="found"></p>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>No encontramos libros con esos filtros. Amplía el precio o cambia de categoría.</p>
</section>

<section class="sec" id="opiniones"><h2 data-t="sections.reviews"></h2><div class="quotes" id="quotes"></div></section>
<section class="sec faq" id="faq"><h2 data-t="sections.faq"></h2><div id="faqList"></div></section>

<section class="news">
  <h2 data-t="news.title"></h2><p data-t="news.text"></p>
  <form id="newsForm" novalidate><input type="email" id="email" placeholder="tu@correo.com" aria-label="Correo electrónico"><button class="btn" data-t="news.btn"></button></form>
  <small id="newsMsg" role="status"></small>
</section>
</main>

<footer id="pie">
  <div><b class="logo" data-t="brand"></b><p data-t="footer.about"></p></div>
  <div><b>Tienda</b><a href="#catalogo">Catálogo</a><a href="#ofertas">Ofertas</a><a href="#top">Más vendidos</a></div>
  <div><b>Ayuda</b><a href="#faq">Preguntas frecuentes</a><a href="#faq">Envíos</a><a href="#faq">Devoluciones</a></div>
  <div><b>Contacto</b><a id="mail" href="#" data-t="footer.email"></a><span data-t="footer.hours"></span></div>
  <p class="copy"><span data-t="footer.copy"></span> · <a href="#admin" id="adminLink">Administrador</a></p>
</footer>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-label="Carrito"></aside>
<div class="modal" id="modal" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" role="status"></div>
<button class="up" id="up" aria-label="Volver arriba">↑</button>

<script src="firebase-config.js"></script>
<script src="content.js"></script>
<script src="app.js"></script>
<script src="cats.js"></script>
<script src="admin.js"></script>
</body>
</html>
